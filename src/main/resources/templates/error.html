<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Error — EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                        <div class="text-danger mb-3">
                            <i class="bi bi-exclamation-octagon-fill display-1" style="color: #ef4444;"></i>
                        </div>
                        <h2 class="fw-bold mb-2 text-dark" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error Occurred'}">
                            Something went wrong
                        </h2>
                        <p class="text-muted mb-4 lead fs-6" th:text="${errorMessage != null ? errorMessage : 'The server encountered an issue processing your request. Please try again later.'}">
                            An unexpected error occurred while processing your request.
                        </p>
                        
                        <div class="p-3 bg-light rounded-3 text-start mb-4 border" th:if="${requestUri}">
                            <small class="text-muted d-block fw-semibold">Target Resource:</small>
                            <code class="text-dark small" th:text="${requestUri}">/events</code>
                        </div>

                        <div class="d-flex gap-2 justify-content-center">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
                                <i class="bi bi-arrow-left me-1"></i> Go Back
                            </a>
                            <a th:href="@{/events}" class="btn btn-primary px-4 py-2" style="background-color: #6366f1; border-color: #6366f1;">
                                <i class="bi bi-grid me-1"></i> Browse Events
                            </a>
                            <a th:href="@{/}" class="btn btn-dark px-4 py-2">
                                <i class="bi bi-house me-1"></i> Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
