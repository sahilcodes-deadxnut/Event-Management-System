<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login — EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">

                    <!-- Login Card -->
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="card-header bg-dark text-white text-center py-4" style="background-color: #0f172a !important;">
                            <div class="rounded-circle bg-primary bg-opacity-25 d-inline-flex p-3 mb-2 text-primary">
                                <i class="bi bi-shield-lock-fill fs-2" style="color: #6366f1 !important;"></i>
                            </div>
                            <h4 class="fw-bold mb-1">Organizer &amp; Admin Portal</h4>
                            <p class="text-secondary small mb-0">Enter credentials to manage events &amp; participants</p>
                        </div>

                        <div class="card-body p-4 p-md-5">

                            <!-- Feedback Alerts -->
                            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span th:text="${errorMessage}">Invalid credentials.</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <span th:text="${successMessage}">Logged out successfully.</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <form th:action="@{/admin/login}" method="POST">
                                <input type="hidden" name="redirect" th:value="${redirect}">

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-dark">
                                        <i class="bi bi-person me-1 text-primary"></i> Username
                                    </label>
                                    <input type="text" name="username" class="form-control form-control-lg rounded-3" 
                                           placeholder="admin" required autofocus autocomplete="username">
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-dark">
                                        <i class="bi bi-key me-1 text-primary"></i> Password
                                    </label>
                                    <input type="password" name="password" class="form-control form-control-lg rounded-3" 
                                           placeholder="••••••••••••" required autocomplete="current-password">
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold py-2 shadow-sm"
                                        style="background-color: #6366f1; border-color: #6366f1;">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                                </button>
                            </form>

                            <!-- Demo Notice -->
                            <div class="mt-4 p-3 bg-light rounded-3 border text-center">
                                <small class="text-muted d-block fw-semibold mb-1">
                                    <i class="bi bi-info-circle me-1 text-primary"></i> Portfolio / Demo Credentials:
                                </small>
                                <code class="small text-dark fw-bold">admin</code> / <code class="small text-dark fw-bold">AdminPassword123!</code>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-top text-center py-3">
                            <a th:href="@{/}" class="text-decoration-none small text-muted">
                                <i class="bi bi-arrow-left me-1"></i> Return to Homepage
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
