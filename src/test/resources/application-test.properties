# Test profile using In-Memory H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.admin.username=admin
app.admin.password=AdminPassword123!
app.verification.enabled=false
app.daemon.enabled=false

logging.level.org.springframework=WARN
logging.level.com.eventhub=INFO
