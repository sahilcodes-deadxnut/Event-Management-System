<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Ticket - EventHub</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="text-center mb-4">
                        <i class="bi bi-ticket-perforated text-primary" style="font-size: 3rem;"></i>
                        <h2 class="fw-bold mt-2">Find Your Ticket Pass</h2>
                        <p class="text-muted">Enter your pass code (e.g., EVT-2026-A101) to look up your reservation and print your pass.</p>
                    </div>

                    <!-- Search Form -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
                        <form th:action="@{/registrations/lookup}" method="get">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light text-muted border-end-0">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" name="code" class="form-control border-start-0 text-uppercase font-monospace" 
                                       placeholder="EVT-2026-XXXX" required>
                                <button type="submit" class="btn btn-primary px-4">Search</button>
                            </div>
                        </form>
                    </div>

                    <!-- Error Alert -->
                    <div th:if="${lookupError}" class="alert alert-warning alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${lookupError}">Ticket not found</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Ticket Found Result -->
                    <div th:if="${registration != null}">
                        <div class="ticket-container">
                            <div class="ticket-header d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-light text-primary px-3 py-1 rounded-pill mb-2 fw-bold" 
                                          th:text="${registration.event.category}">Category</span>
                                    <h4 class="fw-bold mb-0 text-white" th:text="${registration.event.title}">Event Title</h4>
                                </div>
                                <div class="text-end">
                                    <i class="bi bi-qr-code text-white fs-1"></i>
                                </div>
                            </div>

                            <div class="ticket-body">
                                <div class="row g-4 align-items-center">
                                    <div class="col-md-8">
                                        <div class="row g-3">
                                            <div class="col-sm-6">
                                                <small class="text-muted text-uppercase d-block fw-semibold" style="font-size: 0.75rem;">Attendee</small>
                                                <h5 class="fw-bold text-dark mb-0" th:text="${registration.participantName}">Participant Name</h5>
                                            </div>
                                            <div class="col-sm-6">
                                                <small class="text-muted text-uppercase d-block fw-semibold" style="font-size: 0.75rem;">Pass Code</small>
                                                <span class="badge bg-primary fs-6 px-3 py-2 font-monospace" th:text="${registration.registrationCode}">EVT-2026-X89J</span>
                                            </div>

                                            <div class="col-sm-6">
                                                <small class="text-muted text-uppercase d-block fw-semibold" style="font-size: 0.75rem;">Date & Time</small>
                                                <span class="fw-semibold text-secondary" th:text="${registration.event.formattedDate}">Date</span>
                                            </div>
                                            <div class="col-sm-6">
                                                <small class="text-muted text-uppercase d-block fw-semibold" style="font-size: 0.75rem;">Venue</small>
                                                <span class="fw-semibold text-secondary" th:text="${registration.event.venue}">Venue</span>
                                            </div>

                                            <div class="col-sm-6">
                                                <small class="text-muted text-uppercase d-block fw-semibold" style="font-size: 0.75rem;">Registered Email</small>
                                                <span class="text-secondary" th:text="${registration.email}">email</span>
                                            </div>
                                            <div class="col-sm-6">
                                                <small class="text-muted text-uppercase d-block fw-semibold" style="font-size: 0.75rem;">Phone</small>
                                                <span class="text-secondary" th:text="${registration.phone}">phone</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-4 text-center">
                                        <div class="p-2 border rounded-3 bg-light d-inline-block shadow-sm">
                                            <img th:src="@{/servlets/ticket-badge(code=${registration.registrationCode})}" 
                                                 alt="Scannable QR Pass Badge" 
                                                 style="max-width: 140px; height: auto;" 
                                                 class="rounded" />
                                            <div class="small text-muted mt-1 fw-bold" style="font-size: 0.7rem;">
                                                <i class="bi bi-qr-code-scan me-1"></i> Gate Pass
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="ticket-stub d-flex justify-content-between align-items-center">
                                <span class="small text-muted" th:text="'Registered on: ' + ${registration.formattedDate}">Date</span>
                                <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
                                    <i class="bi bi-shield-check me-1"></i> Verified Pass
                                </span>
                            </div>
                        </div>

                        <div class="text-center mt-3 no-print">
                            <button onclick="window.print()" class="btn btn-outline-dark">
                                <i class="bi bi-printer me-1"></i> Print Ticket Pass
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
